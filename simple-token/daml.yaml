sdk-version: 3.4.11
name: simple-token
version: 0.1.0
source: daml
build-options:
  - --target=2.1
  # Enforce exhaustive pattern matching package-wide (all of simple-token, incl. the
  # experimental Cip112/V2 modules): a non-exhaustive `case`/function is a build error, not
  # a runtime pattern-match crash. Motivating case: a closed sum like
  # SimpleToken.Admin.Roles.Role gaining a constructor without a corresponding `delegableRole`
  # clause fails the build, so the delegation policy cannot silently regress.
  - --ghc-option=-Wincomplete-patterns
  - --ghc-option=-Werror=incomplete-patterns
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../dars/splice-api-token-metadata-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v1-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
  - ../dars/splice-api-token-allocation-request-v1-1.0.0.dar
  - ../dars/splice-api-token-holding-v2-1.0.0.dar
  - ../dars/splice-api-token-transfer-instruction-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-instruction-v2-1.0.0.dar
  - ../dars/splice-api-token-allocation-request-v2-1.0.0.dar
  - ../dars/splice-api-token-transfer-events-v2-1.0.0.dar
  - ../dars/splice-token-standard-utils-2.0.0.dar
  # AL-7: consume the decoupled OpenZeppelin AccessControl library
  # (oz-daml-contracts). Only this one package is pulled in — Ownable and
  # Pausable are deliberately NOT consumed (see SimpleToken.Admin.Capability and
  # docs/ARCHITECTURE.md §9), demonstrating "import only what you need".
  - ../dars/oz-access-control-0.1.0.dar
